<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit Finds</title>
<style>
  :root { --bg:#faf7f5; --card:#fff; --text:#1f1a1a; --muted:#7a6f6f; --accent:#c2410c; --line:#eadfd9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161212; --card:#211b1b; --text:#f3ecea; --muted:#a89c9a; --accent:#fb923c; --line:#332a2a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:900px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  input { width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h3 { margin:0 0 2px; font-size:1.05rem; word-break:break-all; }
  .note { font-size:.9rem; color:var(--muted); margin:8px 0 0; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btns a { flex:1; text-align:center; padding:8px; border-radius:8px; text-decoration:none; font-size:.9rem; border:1px solid var(--accent); color:var(--accent); }
  .btns a.ig { background:var(--accent); color:#fff; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fit Finds</h1>
  <p class="sub" id="count"></p>
  <input id="q" type="search" placeholder="Search username or note...">
  <div class="grid" id="grid"></div>
</div>

<script>
/* ==== EDIT HERE: add your accounts ====
   username: without the @
   website:  optional, leave "" if none
   note:     optional
*/
const PROFILES = [
  { username: "example_account", website: "https://example.com", note: "Sample - replace me" },
  { username: "another_account", website: "", note: "Sample - replace me" }
];
/* ================================================ */

const grid = document.getElementById("grid");
const q = document.getElementById("q");
const count = document.getElementById("count");

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({
    "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;"
  }[m]));
}

function render() {
  const term = q.value.trim().toLowerCase();
  const list = PROFILES.filter(p =>
    !term || [p.username, p.note].join(" ").toLowerCase().includes(term)
  );
  count.textContent = list.length + " of " + PROFILES.length + " accounts";
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No accounts found.</div>';
    return;
  }
  grid.innerHTML = list.map(p => {
    const u = encodeURIComponent(p.username.replace(/^@/, ""));
    return '<div class="card"><h3>@' + esc(p.username.replace(/^@/, "")) + '</h3>' +
      (p.note ? '<p class="note">' + esc(p.note) + '</p>' : '') +
      '<div class="btns"><a class="ig" target="_blank" rel="noopener" href="https://instagram.com/' + u + '">Instagram</a>' +
      (p.website ? '<a target="_blank" rel="noopener" href="' + esc(p.website) + '">Website</a>' : '') +
      '</div></div>';
  }).join("");
}

q.addEventListener("input", render);
render();
</script>
</body>
</html>
