<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion IG List</title>
<style>
  :root { --bg:#faf7f5; --card:#fff; --text:#1f1a1a; --muted:#7a6f6f; --accent:#c2410c; --line:#eadfd9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161212; --card:#211b1b; --text:#f3ecea; --muted:#a89c9a; --accent:#fb923c; --line:#332a2a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:900px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  input { width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
  .chip { padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:.9rem; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h3 { margin:0 0 2px; font-size:1.05rem; word-break:break-all; }
  .tag { font-size:.75rem; color:var(--muted); }
  .note { font-size:.9rem; color:var(--muted); margin:8px 0 0; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btns a { flex:1; text-align:center; padding:8px; border-radius:8px; text-decoration:none; font-size:.9rem; border:1px solid var(--accent); color:var(--accent); }
  .btns a.ig { background:var(--accent); color:#fff; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fashion IG List</h1>
  <p class="sub" id="count"></p>
  <input id="q" type="search" placeholder="Search username, note or category...">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
/* ==== EDIT HERE: add your accounts from the book ====
   username: without the @
   category: Clothes, Shoes, Bags, Accessories, etc (any word works)
   website:  optional, leave empty string if none
   note:     optional
*/
const PROFILES = [
  { username: "example_clothes", category: "Clothes", website: "https://example.com", note: "Sample - replace me" },
  { username: "example_shoes", category: "Shoes", website: "", note: "Sample - replace me" }
];
/* ================================================ */

const grid = document.getElementById("grid");
const chips = document.getElementById("chips");
const q = document.getElementById("q");
const count = document.getElementById("count");
let active = "All";

const cats = ["All"].concat(Array.from(new Set(PROFILES.map(function(p) { return p.category; }).filter(Boolean))));
cats.forEach(function(c) {
  const b = document.createElement("button");
  b.className = "chip" + (c === active ? " on" : "");
  b.textContent = c;
  b.onclick = function() {
    active = c;
    Array.from(chips.children).forEach(function(x) {
      x.classList.toggle("on", x.textContent === c);
    });
    render();
  };
  chips.appendChild(b);
});

function render() {
  const term = q.value.trim().toLowerCase();
  const list = PROFILES.filter(function(p) {
    const matchesCat = active === "All" || p.category === active;
    const matchesSearch = !term || [p.username, p.category, p.note].join(" ").toLowerCase().indexOf(term) !== -1;
    return matchesCat && matchesSearch;
  });

  count.textContent = list.length + " of " + PROFILES.length + " accounts";
  grid.innerHTML = "";

  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No accounts found.";
    grid.appendChild(empty);
    return;
  }

  list.forEach(function(p) {
    const name = (p.username || "").replace(/^@/, "");
    const card = document.createElement("div");
    card.className = "card";

    const h3 = document.createElement("h3");
    h3.textContent = "@" + name;
    card.appendChild(h3);

    if (p.category) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = p.category;
      card.appendChild(tag);
    }

    if (p.note) {
      const note = document.createElement("p");
      note.className = "note";
      note.textContent = p.note;
      card.appendChild(note);
    }

    const btns = document.createElement("div");
    btns.className = "btns";

    const ig = document.createElement("a");
    ig.className = "ig";
    ig.target = "_blank";
    ig.rel = "noopener";
    ig.href = "https://instagram.com/" + encodeURIComponent(name);
    ig.textContent = "Instagram";
    btns.appendChild(ig);

    if (p.website) {
      const web = document.createElement("a");
      web.target = "_blank";
      web.rel = "noopener";
      web.href = p.website;
      web.textContent = "Website";
      btns.appendChild(web);
    }

    card.appendChild(btns);
    grid.appendChild(card);
  });
}

q.addEventListener("input", render);
render();
</script>
</body>
</html>
